<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 300px; font-family: system-ui, sans-serif; background:#0a0a0a; color:#fff; padding:14px; }
      h1 { font-size: 15px; margin: 0 0 12px; }
      label { font-size: 12px; display:block; margin-bottom:4px; color:#bbb; }
      input { width:100%; box-sizing:border-box; padding:8px; border-radius:8px; border:1px solid #333; background:#141414; color:#fff; margin-bottom:10px; font-size:12px; }
      button { width:100%; padding:9px; border:0; border-radius:8px; background:#800080; color:#fff; font-weight:600; cursor:pointer; }
      #status { margin-top:10px; font-size:12px; color:#bbb; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Chatys — Agente WhatsApp</h1>
    <label>Chave de acesso (token)</label>
    <input id="token" placeholder="cole a chave gerada no CRM" />
    <label>Endereço do CRM (opcional)</label>
    <input id="gateway" placeholder="deixe em branco para o padrão" />
    <button id="save">Salvar e conectar</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
